# Job Radar sources (connector-free since 2026-11-21).
# Tier 1a: `python3 fetch.py portals` fetches these directly. Every host must be on the allowed-hosts
#          list of the "test24 – Job Radar" cloud environment.
# Tiers 1b, 2 and 3: the built-in WebSearch tool. It has no date filter, so put the current month and
#          year in each query (e.g. "November 2026") and keep only results that are 2 days old or newer.

portal_queries: ["creative director", "creative", "art director", "brand design"]
portals:
  - {name: Amazon, group: tech, adapter: amazon}
  - {name: Netflix, group: tech, adapter: eightfold}
  - {name: Google, group: tech, adapter: google, queries: ["creative", "brand studio", "art director"]}
  - name: Meta
    group: tech
    adapter: generic
    url: "https://www.metacareers.com/jobs?q={q}&offices[0]=Mumbai%2C%20India&offices[1]=Bangalore%2C%20India"
    fallback_search: 'site:metacareers.com "Creative" India'
  - name: Publicis Groupe (Publicis, Leo, BBH, Sapient)
    group: network
    adapter: jibe
    base: "https://careers.publicisgroupe.com"
    company: Publicis Groupe
  - name: Publicis Sapient
    group: consultancy
    adapter: generic
    url: "https://careers.publicissapient.com/job-search?keywords={q}&location=India"
    fallback_search: 'site:careers.publicissapient.com creative India'
  - name: Accenture Song
    group: consultancy
    adapter: generic
    url: "https://www.accenture.com/in-en/careers/jobsearch?jk={q}&jt=experienced%20professionals"
    fallback_search: 'site:accenture.com/in-en/careers/jobdetails Song creative director'
  - name: Omnicom (TBWA, BBDO, DDB, McCann)
    group: network
    adapter: generic
    url: "https://www.omnicomgroup.com/careers/?search={q}&location=India"
    fallback_search: '(TBWA OR BBDO OR DDB OR McCann) "creative director" India job'
  - name: WPP (Ogilvy, VML, Grey)
    group: network
    adapter: generic
    url: "https://careers.wpp.com/jobs?keywords={q}&location=India"
    fallback_search: 'site:careers.wpp.com creative director India'
  - {name: Dentsu, group: network, adapter: workday, host: dentsuaegis.wd3.myworkdayjobs.com, tenant: dentsuaegis, site: DAN_GLOBAL}
  - {name: Edelman, group: network, adapter: workday, host: djeholdings.wd5.myworkdayjobs.com, tenant: djeholdings, site: edelman-careers-E200}
  - name: Deloitte Digital
    group: consultancy
    adapter: generic
    url: "https://apply.deloitte.com/careers/SearchJobs/{q}?listFilterMode=1"
    fallback_search: 'Deloitte Digital "creative director" India job'

# Boutiques have no portals. Search for their hiring posts (Tier 2).
boutiques: [Talented, "Tilt Brand Solutions", Moonshot, Schbang, "White Rivers Media", Kinnect, Enormous, Thinkstr, "Infectious Advertising", "Only Much Louder", "Lowe Lintas", "Leo India", "Wondrlab", "Dentsu Creative India"]

# Tier 1b: ATS sweep with WebSearch. Use allowed_domains = [domain] and the query below.
# For a Greenhouse or Lever company it finds, `fetch.py board greenhouse <token>` lists the whole board.
ats_domains: [myworkdayjobs.com, greenhouse.io, jobs.lever.co, jobs.smartrecruiters.com, jobs.ashbyhq.com, oraclecloud.com, darwinbox.in, keka.com]
ats_query: '"Executive Creative Director" OR "Head of Creative" OR "Creative Director" India Mumbai Bengaluru'

# Tier 2: job boards. WebSearch; titles and snippets only (board pages aren't fetched).
board_queries:
  - {q: '"Executive Creative Director" Mumbai job', domains: [glassdoor.co.in, glassdoor.com]}
  - {q: '"Creative Director" Bengaluru job', domains: [glassdoor.co.in]}
  - {q: '"Executive Creative Director" OR "Creative Head" OR "Group Creative Director" Mumbai', domains: [naukri.com]}
  - {q: '"Creative Director" OR "Creative Head" advertising', domains: [iimjobs.com, foundit.in]}
  - {q: '"Executive Creative Director" OR "Creative Director" Mumbai', domains: [in.indeed.com]}
  - {q: '"Creative" Head OR Director OR Lead India', domains: [wellfound.com, cutshort.io, instahyre.com]}
  - {q: 'agency hiring "Executive Creative Director" OR "Creative Head" Mumbai OR Bengaluru'}

# Tier 3: trade-press signals. WebSearch, newest first. Keep stories from the last 2 days only.
signal_queries:
  - {q: '"executive creative director" OR "chief creative officer" OR "national creative director" quits OR joins OR appoints OR elevated', domains: [afaqs.com, exchange4media.com, campaignindia.in, storyboard18.com, bestmediainfo.com]}
  - {q: 'creative mandate OR "account win" OR "pitch win" agency', domains: [afaqs.com, exchange4media.com, campaignindia.in, storyboard18.com]}
  - {q: 'agency Bengaluru office OR "new office" OR expands creative', domains: [afaqs.com, exchange4media.com, campaignindia.in]}
  - {q: 'Netflix OR "Prime Video" OR YouTube OR Meta OR "Accenture Song" India creative head OR "creative studio" appoints OR hires OR exits'}

locations:
  primary: [Mumbai, "Navi Mumbai", Thane, Bengaluru, Bangalore, "India Remote", Remote]
  also_seen: [Dubai, "Abu Dhabi", UAE, Riyadh, Saudi, Doha, Qatar, MENA]
